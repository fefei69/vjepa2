# Run A-firstmove: V-JEPA 2-AC fine-tuned from the released DROID predictor (vjepa2-ac-vitg.pt) on the ONE-MOVE
# dataset: the first move of the six H15 tasks (ring 1 off a full stack), 48 train / 6 val / 6 test episodes
# (data/expert6_first_move, built by app/vjepa_hanoi/build_single_move_archive.py --first_moves_only; the same data
# handed to the VLA / world-action models). Hyperparameters identical to A and A-expert: 15k steps x 32 clips, about
# 26 passes over the 18,225 training clips; best.pt is chosen on the validation episodes.
# Launch: sbatch --export=ALL,CONFIG=configs/train/vitg16/hanoi-firstmove-ac-ft-256px-8f.yaml app/vjepa_hanoi/train.sbatch
app: vjepa_hanoi
folder: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/A_firstmove_vitg_finetune_v1
nodes: 1
tasks_per_node: 2   # 2x H200: the 4-GPU request waited on the partition GPU caps
data:
  datasets:
  - /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/train.npz
  val_dataset: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/val.npz
  test_dataset: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/test.npz
  val_max_windows: 2460       # all validation clips
  batch_size: 16              # per GPU -> 32 clips per step on 2 GPUs (smoke: 23 GB/GPU at batch 8)
  crop_size: 256              # 224 px frames resized to the encoder's 16x16 pretraining grid
  dataset_fpcs: [8]           # 8 frames, 8 states, 7 actions per clip
  fps: 4                      # every 8th 30 Hz row (3.75 Hz, the DROID rate)
  num_workers: 8
  patch_size: 16
  pin_mem: true
  persistent_workers: true
  tubelet_size: 2
data_aug:                     # no augmentation (stated per handover section 9): deterministic full-frame resize
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio: [1.0, 1.0]
  random_resize_scale: [1.0, 1.0]
  reprob: 0.0
loss:
  auto_steps: 2
  loss_exp: 1.0
  normalize_reps: true
meta:
  dtype: bfloat16
  pretrain_checkpoint: /scratch/cw5167/checkpoints/vjepa2/vjepa2-ac-vitg.pt  # NOT folder/latest.pt (epoch 315)
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  load_predictor: true          # 7-D action/state encoders load as-is (Hanoi data mapped to the DROID convention)
  resume_checkpoint: null
  checkpoint_every: 5         # latest.pt every 5 epochs (~6 GB B / ~12 GB A) = resume granularity
  save_every_freq: 25
  val_every: 5
  seed: 239
  use_sdpa: true
model:
  model_name: vit_giant_xformers  # 22 heads; vit_giant (16 heads) has the same shapes but wrong features
  max_num_frames: 64          # predictor causal-mask capacity only (32 steps); runtime uses 8
  action_embed_dim: 7
  pred_depth: 24              # the released V-JEPA 2-AC predictor design
  pred_embed_dim: 1024
  pred_num_heads: 16
  pred_is_frame_causal: true
  uniform_power: true
  use_activation_checkpointing: true
  use_extrinsics: false
  use_rope: true
optimization:                 # as the play and expert runs: 15k steps x 32 clips (~26 passes over 18,225 clips)
  epochs: 50
  ipe: 300
  warmup: 2
  anneal: 10
  lr: 0.0001
  start_lr: 0.00002
  final_lr: 0.0
  weight_decay: 0.04
  final_weight_decay: 0.04
