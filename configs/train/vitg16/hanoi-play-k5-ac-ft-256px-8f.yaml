# Run A -- V-JEPA 2-AC, FINE-TUNE the released predictor, on the Tower-of-Hanoi play_k5 split: the same data as the
# pi0.5 / Cosmos runs (manifest split, section-3 usable-row filter; openpi/docs/hanoi_play_k5_dataset_handover.md).
# Starts from vjepa2-ac-vitg.pt (DROID-trained): frozen V-JEPA 2 ViT-g encoder ('target_encoder', the copy the AC
# predictor was trained against) + its 305M predictor. The only released AC predictor is ViT-g, so this run is ViT-g.
# Launch: sbatch --export=ALL,CONFIG=configs/train/vitg16/hanoi-play-k5-ac-ft-256px-8f.yaml app/vjepa_hanoi/train.sbatch
#         with --ntasks-per-node=2 --gres=gpu:h200:2 (see app/vjepa_hanoi/README.md)
app: vjepa_hanoi
folder: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/A_vitg_finetune_v1
nodes: 1
tasks_per_node: 2   # 2x H200: the 4-GPU request waited on the partition GPU caps
data:
  datasets:
  - /scratch/cw5167/workspace/openpi/data/hanoi/play_k5_pi05/indices/play_train.npz
  val_dataset: /scratch/cw5167/workspace/openpi/data/hanoi/play_k5_pi05/indices/play_val.npz
  test_dataset: /scratch/cw5167/workspace/openpi/data/hanoi/play_k5_pi05/indices/play_test.npz
  val_max_windows: 2048       # fixed, evenly spaced validation clips (of 81,063)
  batch_size: 16              # per GPU -> 32 clips per step on 2 GPUs (smoke: 23 GB/GPU at batch 8)
  crop_size: 256              # 224 px frames resized to the encoder's 16x16 pretraining grid
  dataset_fpcs: [8]           # 8 frames, 8 states, 7 actions per clip
  fps: 4                      # every 8th 30 Hz row (3.75 Hz, the DROID rate)
  num_workers: 8
  patch_size: 16
  pin_mem: true
  persistent_workers: true
  tubelet_size: 2
data_aug:                     # no augmentation (stated per handover section 9): deterministic full-frame resize
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio: [1.0, 1.0]
  random_resize_scale: [1.0, 1.0]
  reprob: 0.0
loss:
  auto_steps: 2
  loss_exp: 1.0
  normalize_reps: true
meta:
  dtype: bfloat16
  pretrain_checkpoint: /scratch/cw5167/checkpoints/vjepa2/vjepa2-ac-vitg.pt  # NOT folder/latest.pt (epoch 315)
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  load_predictor: true          # 7-D action/state encoders load as-is (Hanoi data mapped to the DROID convention)
  resume_checkpoint: null
  checkpoint_every: 5         # latest.pt every 5 epochs (~6 GB B / ~12 GB A) = resume granularity
  save_every_freq: 25
  val_every: 5
  seed: 239
  use_sdpa: true
model:
  model_name: vit_giant_xformers  # 22 heads; vit_giant (16 heads) has the same shapes but wrong features
  max_num_frames: 64          # predictor causal-mask capacity only (32 steps); runtime uses 8
  action_embed_dim: 7
  pred_depth: 24              # the released V-JEPA 2-AC predictor design
  pred_embed_dim: 1024
  pred_num_heads: 16
  pred_is_frame_causal: true
  uniform_power: true
  use_activation_checkpointing: true
  use_extrinsics: false
  use_rope: true
optimization:                 # fine-tuning, untuned: 15k steps x 32 clips ~ 0.7 passes over the 653,784 training clips
  epochs: 50
  ipe: 300
  warmup: 2
  anneal: 10
  lr: 0.0001
  start_lr: 0.00002
  final_lr: 0.0
  weight_decay: 0.04
  final_weight_decay: 0.04
