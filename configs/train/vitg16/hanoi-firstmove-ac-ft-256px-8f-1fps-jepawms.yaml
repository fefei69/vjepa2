# Run J-firstmove-1fps: V-JEPA 2-AC fine-tuned on the one-move dataset from the JEPA-WMs CORRECTED V-JEPA 2-AC (Terver
# et al., arXiv 2512.24497, Appendix C) instead of the released vjepa2-ac-vitg.pt, whose 2-step rollout loss term was
# computed with the bug fixed in vjepa2 commit 93366fe (May 2025 checkpoint, June 2025 fix). The JEPA-WMs model is the
# same V-JEPA 2-AC predictor retrained on DROID with the fixed loss (jepa-wms hubconf 'vjepa2_ac_droid'). Everything
# else is the fps-1 run (hanoi-firstmove-ac-ft-256px-8f-1fps.yaml): same data, fps 1, recipe, loss (the official
# post-fix V-JEPA 2-AC loss; JEPA-WMs weights its terms L_TF/3 + L_2step/2, not ported), val_every 1.
# Changes vs A-firstmove (fps 4, released init), all forced by starting from the corrected model except the step:
#   1. predictor init  droid_vj2ac_noprop.pth.tar (epoch 315), loaded strictly (app/vjepa_hanoi/jepawms_init.py)
#   2. encoder         vitg.pt 'encoder' (the online V-JEPA 2 ViT-g encoder the JEPA-WMs predictor was trained on;
#                      the released AC checkpoint bundles vitg.pt 'target_encoder', which differs in all 484 tensors,
#                      max |diff| 0.042); frozen as before
#   3. no state token  model.use_state false: the corrected model was retrained without proprioception, so the
#                      predictor never sees the arm state (the released one does); planning code is unchanged
#   4. model step      data.fps 1 (1.0 s per step) instead of 4 (as A-firstmove-1fps); the init was trained at 0.267 s
# Launch: sbatch --export=ALL,CONFIG=configs/train/vitg16/hanoi-firstmove-ac-ft-256px-8f-1fps-jepawms.yaml app/vjepa_hanoi/train.sbatch
app: vjepa_hanoi
folder: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/J_firstmove_1fps_vitg_finetune_v1
nodes: 1
tasks_per_node: 2   # 2x H200: the 4-GPU request waited on the partition GPU caps
data:
  datasets:
  - /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/train.npz
  val_dataset: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/val.npz
  test_dataset: /scratch/cw5167/checkpoints/vjepa2_ac_hanoi/data/expert6_first_move/test.npz
  val_max_windows: 1680       # all validation clips at fps 1
  batch_size: 16              # per GPU -> 32 clips per step on 2 GPUs (smoke: 23 GB/GPU at batch 8)
  crop_size: 256              # 224 px frames resized to the encoder's 16x16 pretraining grid
  dataset_fpcs: [8]           # 8 frames, 8 states, 7 actions per clip
  fps: 1                      # every 30th 30 Hz row (1.0 s per model step; fps 4 = every 8th row, the DROID rate)
  num_workers: 8
  patch_size: 16
  pin_mem: true
  persistent_workers: true
  tubelet_size: 2
data_aug:                     # no augmentation (stated per handover section 9): deterministic full-frame resize
  auto_augment: false
  horizontal_flip: false
  motion_shift: false
  random_resize_aspect_ratio: [1.0, 1.0]
  random_resize_scale: [1.0, 1.0]
  reprob: 0.0
loss:
  auto_steps: 2
  loss_exp: 1.0
  normalize_reps: true
meta:
  dtype: bfloat16
  pretrain_checkpoint: /scratch/cw5167/checkpoints/vjepa2/vitg.pt  # encoders only (its 'predictor' is the mask predictor)
  context_encoder_key: encoder
  target_encoder_key: encoder
  load_predictor: false         # the AC predictor comes from jepawms_predictor_checkpoint
  jepawms_predictor_checkpoint: /scratch/cw5167/checkpoints/jepa_wms/droid_vj2ac_noprop.pth.tar
  resume_checkpoint: null
  checkpoint_every: 5         # latest.pt every 5 epochs (~6 GB B / ~12 GB A) = resume granularity
  save_every_freq: 25
  val_every: 1               # best.pt selection every epoch (A-firstmove: lowest at its first check, epoch 5)
  seed: 239
  use_sdpa: true
model:
  model_name: vit_giant_xformers  # 22 heads; vit_giant (16 heads) has the same shapes but wrong features
  max_num_frames: 64          # predictor causal-mask capacity only (32 steps); runtime uses 8
  action_embed_dim: 7
  pred_depth: 24              # the released V-JEPA 2-AC predictor design
  pred_embed_dim: 1024
  pred_num_heads: 16
  pred_is_frame_causal: true
  uniform_power: true
  use_activation_checkpointing: true
  use_extrinsics: false
  use_state: false            # the corrected model has no state token (proprio_tokens 0)
  use_rope: true
optimization:                 # as the play and expert runs: 15k steps x 32 clips (~40 passes over 11,940 clips)
  epochs: 15                  # 2026-10-15: was 50 (A-firstmove's validation was best at epoch 5, then rose)
  ipe: 300
  warmup: 2
  anneal: 5                   # was 10
  lr: 0.0001
  start_lr: 0.00002
  final_lr: 0.0
  weight_decay: 0.04
  final_weight_decay: 0.04
